[workspace]
members = [
    "crates/palate",
    "crates/palate-cli",
    "crates/palate-capi",
    "crates/palate_polyglot_tokenizer",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Ivan <monkslc@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/casualjim/palate"
homepage = "https://github.com/casualjim/palate"

[workspace.metadata.release]
sign-commit = false
sign-tag = false
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore: Release {{crate_name}} version {{version}}"

[workspace.dependencies]
aho-corasick = "1.0"
casey = "0.4"
cc = "1"
clap = "4.5"
convert_case = "0.10.0"
fancy-regex = "0.14"
ignore = "0.4"
infer = "0.19"
lazy-regex = "3.0"
once_cell = "1.18"
palate = { path = "crates/palate" }
palate_polyglot_tokenizer = { path = "crates/palate_polyglot_tokenizer", version = "0.2.1" }
phf = "0.12.1"
phf_codegen = "0.12.1"
regex = "1.9"
serde = "1.0"
serde_json = "1.0"
serde_norway = "0.9"
serde_with = "3"
strum = "0.27"
strum_macros = "0.27"
termcolor = "1.4"
tokio = "1"
toml = "0.8"
walkdir = "2"

[profile.dist]
inherits = "release"
lto = "thin"
