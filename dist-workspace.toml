[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# Keep release.yml hand-extended for C API packaging metadata.
allow-dirty = ["ci"]
# Release only the installable CLI and the C API adapter.
packages = ["palate-cli", "palate-capi"]
# The installers to generate for the CLI app
installers = ["shell", "powershell", "homebrew"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps/libraries for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "casualjim/homebrew-taps"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Keep releases focused on CLI installers and C API archives (no updater sidecars).
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true

[dist.github-custom-runners]
# Prefer native runners (no cross builds)
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
