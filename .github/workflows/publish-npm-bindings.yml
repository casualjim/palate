name: Publish Node bindings to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      tag:
        required: false
        type: string
      tag-flag:
        required: false
        type: string
      publishing:
        required: false
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test Node binding
        working-directory: crates/palate-napi
        run: |
          npm ci
          npm run build
          npm test
      - name: Read package metadata
        id: package
        working-directory: crates/palate-napi
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Check whether version already exists on npm
        id: exists
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }} already exists on npm; skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: ${{ steps.exists.outputs.published != 'true' }}
        working-directory: crates/palate-napi
        run: npm publish --provenance --access public
